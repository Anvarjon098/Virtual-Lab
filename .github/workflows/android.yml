name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # Releases sahifasiga APK yuklash uchun

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk ../Qurilish-Lab.apk

      # APK zip'siz, to'g'ridan-to'g'ri .apk fayl sifatida Releases'ga qo'yiladi.
      # Doimiy havola: https://github.com/<owner>/<repo>/releases/latest/download/Qurilish-Lab.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Qurilish-Lab.apk \
            --title "Qurilish Lab $TAG" \
            --notes "Android uchun Qurilish Lab ilovasi. Qurilish-Lab.apk faylini telefonga yuklab oling va o'rnating." \
            --latest
